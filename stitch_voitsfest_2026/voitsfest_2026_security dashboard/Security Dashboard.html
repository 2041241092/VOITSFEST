<style>
        body {
            background-color: #0B1026; /* Midnight Navy */
            background-image: radial-gradient(circle at 50% 50%, rgba(46, 78, 143, 0.1) 0%, transparent 100%),
                              url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.03"/></svg>');
            color: #e0e3e5;
        }
        
        .glass-panel {
            background-color: rgba(46, 78, 143, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glow-accent {
            box-shadow: 0 0 15px rgba(176,198,255,0.1);
        }
        
        /* Scanner animation */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        
        .scanner-line {
            animation: scanline 2s linear infinite;
            background: linear-gradient(to bottom, transparent, #b0c6ff 50%, transparent);
        }
        
        /* Overlay States */
        .overlay-success {
            background-color: rgba(11, 16, 38, 0.85); /* Midnight Navy base */
            backdrop-filter: blur(10px);
            border: 2px solid #4ADE80; /* Emerald Green */
            box-shadow: inset 0 0 50px rgba(74, 222, 128, 0.2);
        }
        
        .overlay-error {
            background-color: rgba(11, 16, 38, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #F43F5E; /* Rose Red */
            box-shadow: inset 0 0 50px rgba(244, 63, 94, 0.2);
        }

        /* Material Icon thin stroke setup */
        .material-symbols-outlined {
          font-variation-settings:

<script>
        // Simple script to toggle states for demonstration purposes
        function showSuccess() {
            document.getElementById('successOverlay').classList.remove('hidden');
            document.getElementById('successOverlay').classList.add('flex');
            document.getElementById('errorOverlay').classList.add('hidden');
            document.getElementById('errorOverlay').classList.remove('flex');
        }

        function showError() {
            document.getElementById('errorOverlay').classList.remove('hidden');
            document.getElementById('errorOverlay').classList.add('flex');
            document.getElementById('successOverlay').classList.add('hidden');
            document.getElementById('successOverlay').classList.remove('flex');
        }

        function hideOverlays() {
            document.getElementById('successOverlay').classList.add('hidden');
            document.getElementById('successOverlay').classList.remove('flex');
            document.getElementById('errorOverlay').classList.add('hidden');
            document.getElementById('errorOverlay').classList.remove('flex');
        }
